/* Layout concept: single phone-width column; blue gradient header bands with a white card floating over them, soft cards below, dark photo viewer. */
:root{
  --bg:#f3f7fc; --card:#FFFFFF; --fg:#0E2347; --muted:#62728C; --line:#E7EDF8;

}

  --g1:#3B6DF0; --g2:#2146A8; --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 12px 30px rgba(0,0,0,.5);
  --danger:#FF7A87; --danger-bg:#3A1A24; --ok:#7BE0A8; --ok-bg:#12332A; --neutral-chip:#1B2B55; --neutral-fg:#C5D3F2;
  --dark:#050C1C; --dark2:#0D1D3C; --chev:#6F82AA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1630; --card:#12224A; --fg:#EAF0FF; --muted:#9FB0D3; --line:#213566;
  --tint:#1A2E63; --tint-fg:#A9C3FF; --accent:#5B8DFF; --field:#0F1D3F; --fieldline:#243A70;
  --g1:#3B6DF0; --g2:#2146A8; --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 12px 30px rgba(0,0,0,.5);
  --danger:#FF7A87; --danger-bg:#3A1A24; --ok:#7BE0A8; --ok-bg:#12332A; --neutral-chip:#1B2B55; --neutral-fg:#C5D3F2;

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hdr{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 100%);border-radius:0 0 32px 32px;color:#fff;padding-top:18px;padding-bottom:28px}
.hdr.tall{padding-bottom:84px}
.hdr::before{content:"";position:absolute;top:-70px;left:-50px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hdr::after{content:"";position:absolute;top:50px;right:-80px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
.hdr .pad{position:relative;z-index:1}
.hrow{display:flex;align-items:center;gap:12px}

.iconbtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;flex-shrink:0}
.btn-white{display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 16px;border-radius:23px;background:#fff;color:#004cab;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(8,30,90,.25)}
.float{margin-top:-52px;position:relative;z-index:2}

.sec{padding-top:22px;display:flex;flex-direction:column;gap:14px}

.grow{flex:1;min-width:0}

.chev{color:var(--chev);flex-shrink:0}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 20px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;font-size:14.5px;font-weight:800;width:100%}

.btn.soft{background:var(--tint);color:var(--tint-fg)}
.btn.grad{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;min-height:58px;border-radius:18px;font-size:18px;box-shadow:0 10px 22px rgba(0,76,171,.35)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.off{opacity:.55}
.addbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 14px;border-radius:22px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;font-size:14.5px;font-weight:800;box-shadow:0 8px 18px rgba(0,76,171,.3);flex-shrink:0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.exp-top{display:flex;align-items:center;gap:12px;width:100%}
.tag{font-size:13.5px;font-weight:700;color:var(--accent)}
.tag.n{color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ch .ico{width:42px;height:42px;border-radius:13px}
.ch h2{font-size:18px}
.tiles{display:flex;gap:10px}
.tile{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:16px;background:var(--bg)}
.tile>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile input{width:100%;min-width:0;border:0;background:transparent;font-size:20px;font-weight:800;padding:0;direction:rtl;color:var(--fg)}
.tile.hot{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff}
.tile.hot>span{color:rgba(255,255,255,.9)}
.tile.hot b{font-size:21px;font-weight:800}
.result{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--tint);color:var(--tint-fg);font-weight:700;font-size:14px}
.result b{font-size:19px;font-weight:800}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;gap:10px;padding:14px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(0,76,171,.12);z-index:20}
.bar .btn{min-height:56px;border-radius:16px;font-size:15px}
.form{background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label,.fld .l{font-size:14px;font-weight:700;color:var(--neutral-fg)}
.in{width:100%;height:54px;padding:0 16px;border:2px solid var(--fieldline);border-radius:16px;background:var(--field);font-size:16px;font-weight:700;direction:rtl;color:var(--fg)}
.in:focus{border-color:var(--accent);outline:none}
.in.big{height:64px;font-size:30px;font-weight:800;color:var(--accent);border-color:var(--accent);background:var(--card);border-radius:18px;padding-inline-start:70px}
.amtwrap{position:relative}.amtwrap span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.dayview{height:54px;display:flex;align-items:center;padding:0 14px;border-radius:16px;background:var(--tint);color:var(--tint-fg);font-weight:800}
.seg{display:flex;gap:8px;padding:5px;border-radius:18px;background:var(--bg)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:14px;color:var(--muted);font-size:15px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 6px 14px rgba(0,76,171,.3)}
.hint{font-size:12.5px;color:var(--muted)}
.infobox{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--tint);color:var(--tint-fg);font-size:13.5px;line-height:1.7;font-weight:500}
.dark{background:var(--dark);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.dark .top{display:flex;align-items:center;gap:12px;padding-top:18px;padding-bottom:8px}
.dark .iconbtn{background:rgba(255,255,255,.14)}
.mode{display:flex;gap:6px;padding:5px;border-radius:18px;background:rgba(255,255,255,.1);margin-top:10px}
.mode button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;color:#fff;font-size:15px;font-weight:800;background:rgba(255,255,255,.14)}
.mode button.first{background:#fff;color:#004cab}
.finder{flex:1;min-height:340px;position:relative;margin-top:16px;border-radius:24px;background:linear-gradient(180deg,var(--dark2),var(--dark));display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.finder img{max-width:100%;max-height:60vh;object-fit:contain;display:block}
.finder .ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:#C9D6EE;text-align:center;padding:24px;font-size:14.5px}
.corner{position:absolute;width:34px;height:34px;border:4px solid #fff}
.c1{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:10px 0 0 0}
.c2{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:0 10px 0 0}
.c3{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 0 10px}
.c4{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 10px 0}
.dbtns{display:flex;gap:10px;padding-top:14px;padding-bottom:28px}
.dbtns .btn{min-height:58px;border-radius:18px;font-size:16px}
.dbtns .a{background:rgba(255,255,255,.12);color:#fff}
.dbtns .b{background:linear-gradient(160deg,#347dde,#1764c3);color:#fff;box-shadow:0 10px 22px rgba(0,76,171,.45)}
.pill{display:flex;align-items:center;height:38px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.14);font-size:15px;font-weight:800}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:rtl}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px 16px}
.slide img{max-width:100%;max-height:68vh;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.dots{display:flex;justify-content:center;gap:8px;padding:10px 0 14px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);transition:all .2s}
.dots i.on{width:24px;background:#fff}
.infobar{display:flex;align-items:center;gap:12px;margin:0 max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.1)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.opt.main{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;border:0;box-shadow:0 10px 22px rgba(0,76,171,.3)}
.opt.main .ico{background:rgba(255,255,255,.2);color:#fff}
.opt b{font-size:18px;font-weight:800;display:block}
.opt small{font-size:13px;color:var(--muted);font-weight:500}
.opt.main small{color:rgba(255,255,255,.9)}
.okbox{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--ok-bg);color:var(--ok);font-size:14.5px;font-weight:800}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));background:#0E2347;color:#fff;padding:12px 18px;border-radius:16px;font-size:14.5px;font-weight:700;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);background:var(--card);border-radius:28px 28px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.sheet h2{font-size:19px;font-weight:800}
.sheet textarea{width:100%;min-height:200px;border:2px solid var(--fieldline);border-radius:16px;background:var(--field);padding:12px 14px;font-size:14.5px;line-height:1.7;direction:rtl;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Professional finish */
.installhint{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid #d5e2f2;background:#eff5fc;border-radius:16px;color:#123e75}
.installmark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#dce8f7;color:#004cab;font-size:21px;flex:none}
.installhint b{display:block;font-size:14px;font-weight:800}.installhint small{display:block;font-size:12px;color:#536d90;margin-top:2px}

:root{--bg:#F4F6F8;--card:#FFFFFF;--fg:#172B43;--muted:#718096;--line:#E5EAF0;--tint:#e5eef9;--tint-fg:#083d83;--accent:#004cab;--field:#F8FAFB;--fieldline:#dce5f0;--g1:#123d70;--g2:#082e60;--shadow:0 5px 18px rgba(19,44,64,.055);--shadow-lg:0 12px 28px rgba(19,44,64,.12);--danger:#B93846;--danger-bg:#FCEDEF;--ok:#16704D;--ok-bg:#E8F5EE;--neutral-chip:#EEF1F4;--neutral-fg:#42566A;--dark:#091727;--dark2:#082e60;--chev:#9AA8B5}

.app{max-width:560px;padding-bottom:calc(42px + env(safe-area-inset-bottom,0px))}
.hdr{background:linear-gradient(145deg,#154c86 0%,#082e60 75%);border-radius:0 0 30px 30px}

.hdr::after{background:rgba(255,255,255,.045)}

.stat,.card,.tripcard,.form{border-color:var(--line);box-shadow:var(--shadow)}
.stat{border-radius:22px}

.ico{background:#e5eef9;color:#004cab}
.btn.grad,.addbtn{background:linear-gradient(135deg,#175fbb,#003b86);box-shadow:0 7px 18px rgba(0,76,171,.2)}

.btn-white{color:#083d83}

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=s=>String(s).replace(/\d/g,d=>AR[d]);
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pISO=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return {y,m,d}};
const fmtDate=iso=>{if(!iso)return '—';const {y,m,d}=pISO(iso);return ar(d)+' '+MONTHS[m-1]+' '+ar(y)};
const dayName=iso=>{if(!iso)return '';const {y,m,d}=pISO(iso);return DAYS[new Date(y,m-1,d).getDay()]};
const fmtRange=(a,b)=>{if(!a||!b)return fmtDate(a||b);const A=pISO(a),B=pISO(b);if(A.y===B.y&&A.m===B.m)return ar(A.d)+' إلى '+ar(B.d)+' '+MONTHS[B.m-1]+' '+ar(B.y);return fmtDate(a)+' إلى '+fmtDate(b)};
const fmtMoney=n=>ar(new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n||0)).replace(/,/g,'٬').replace(/\./g,'٫');
const toNum=s=>{const t=String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/٫/g,'.').replace(/[٬,\s]/g,'');const n=parseFloat(t);return isFinite(n)?n:0};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtTime=t=>{if(t==null||t==='')return '—';const mins=typeof t==='number'?((t%1440)+1440)%1440:toMin(t);const h=Math.floor(mins/60),m=mins%60;const h12=h%12===0?12:h%12;return ar(h12)+':'+ar(String(m).padStart(2,'0'))+' '+(h<12?'ص':'م')};
const fmtDur=min=>{const h=Math.floor(min/60),m=min%60;const parts=[];
  if(h>0)parts.push(h===1?'ساعة':h===2?'ساعتان':(h<=10?ar(h)+' ساعات':ar(h)+' ساعة'));
  if(m===30&&h>0)return parts[0]+' ونص';
  if(m>0)parts.push(ar(m)+' دقيقة');
  return parts.join(' و')||'٠ ساعة'};
const otMinutes=t=>{const a=toMin(t.ot&&t.ot.s),b=toMin(t.ot&&t.ot.e);if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d};
const days=t=>t.ots||(t.ots=[{date:t.start,s:t.ot?.s||'',e:t.ot?.e||''}]);
const dayM=d=>otMinutes({ot:d});
const allM=t=>days(t).reduce((n,d)=>n+(dayM(d)||0),0);
const budget=t=>t.budget==null||t.budget===''?'—':fmtMoney(t.budget)+' ريال';
const balances=t=>'<div class="budgetgrid"><span>الميزانية<b>'+budget(t)+'</b></span><span>المدفوع<b>'+fmtMoney(tripTotal(t))+' ريال</b></span><span>المتبقي<b style="color:'+(t.budget!=null&&t.budget!==''&&t.budget<tripTotal(t)?'#c33':'inherit')+'">'+(t.budget==null||t.budget===''?'—':fmtMoney(t.budget-tripTotal(t))+' ريال')+'</b></span></div>';
const otUI=t=>days(t).map((d,i)=>'<div class="otday"><div class="ch"><b>اليوم '+ar(i+1)+'</b>'+(i?'<button class="addbtn" data-act="removeOT" data-id="'+i+'">حذف</button>':'')+'</div><label class="tile"><span>تاريخ العمل الإضافي</span><input type="date" data-bind="ots.'+i+'.date" value="'+esc(d.date||'')+'"></label><div class="tiles"><label class="tile"><span>وقت البداية</span><input type="time" data-bind="ots.'+i+'.s" value="'+esc(d.s)+'"></label><label class="tile"><span>وقت النهاية</span><input type="time" data-bind="ots.'+i+'.e" value="'+esc(d.e)+'"></label></div><div class="result"><span>ساعات الأوفر تايم</span><b data-ot="'+i+'">'+(dayM(d)==null?'—':fmtDur(dayM(d)))+'</b></div></div>').join('');
const carEnd=t=>{const a=toMin(t.car);return a==null?null:a+480};
const tripTotal=t=>t.expenses.reduce((s,e)=>s+(+e.amount||0),0);
const CATS={stay:{l:'سكن',i:'bed'},food:{l:'تغذية',i:'food'},other:{l:'أخرى',i:'wrench'}};
const I={up:'<path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>',
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>',
food:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 4-3 7h3v11"/>',
wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>',
cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
gal:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ret:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',
car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3"/>',
save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
send:'<path d="M21 3l-8 18-3-8-7-3z"/>',chev:'<path d="M15 6l-6 6 6 6"/>',check:'<path d="M5 12l5 5 9-10"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
close:'<path d="M6 6l12 12M18 6L6 18"/>',retry:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
sl:'<path d="M9 6l6 6-6 6"/>'
};
const ic=(n,s=20,w=2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const DB={db:null,mem:{trips:{},photos:{}},
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('masarif-rihlat',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('trips',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  run(store,mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  async all(s){if(!this.db)return Object.values(this.mem[s]);try{return await this.run(s,'readonly',o=>o.getAll())||[]}catch(e){return Object.values(this.mem[s])}},
  async get(s,id){if(!this.db)return this.mem[s][id];try{return await this.run(s,'readonly',o=>o.get(id))}catch(e){return this.mem[s][id]}},
  async put(s,v){this.mem[s][v.id]=v;if(this.db){try{await this.run(s,'readwrite',o=>o.put(v))}catch(e){}}},
  async del(s,id){delete this.mem[s][id];if(this.db){try{await this.run(s,'readwrite',o=>o.delete(id))}catch(e){}}}
};

/* ---------- state ---------- */
let TRIPS=[];let S={screen:'main'};let stack=[];let draft=null;let pending=null;let viewerImgs=[];

const sortTrips=()=>TRIPS.sort((a,b)=>String(b.start).localeCompare(String(a.start)));
const cur=()=>TRIPS.find(t=>t.id===S.tid);
const saveTrip=t=>DB.put('trips',t);
/* ---------- UI utilities ---------- */
let tt=null;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},2600)}
function modal(html){const m=document.getElementById('modal');m.innerHTML=html;m.hidden=false}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML=''}
function confirmBox(msg,label,fn){modal('<div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(msg)+'</h2><div class="btns"><button class="btn danger" data-act="mOk">'+esc(label)+'</button><button class="btn soft" data-act="mNo">إلغاء</button></div></div>');confirmBox.fn=fn}
function go(screen,params,push){if(push!==false)stack.push(S);S=Object.assign({screen:screen},params||{});render();window.scrollTo(0,0)}
function back(){S=stack.pop()||{screen:'main'};render();}

/* ---------- views ---------- */
function hdr(title,sub,opts){opts=opts||{};
 return '<div class="hdr'+(opts.tall?' tall':'')+'"><div class="pad"><div class="hrow"><button class="iconbtn" data-act="back" aria-label="رجوع">'+ic('back',22,2.4)+'</button><div class="grow ttl"><h1>'+esc(title)+'</h1>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>'+(opts.right||'')+'</div>'+(opts.extra||'')+'</div></div>'}

function vMain(){
 const active=TRIPS.find(t=>t.start<=todayISO()&&t.end>=todayISO());
 const list=TRIPS.length?TRIPS.map(t=>'<div class="trip-shell"><button class="tripcard" data-act="openTrip" data-id="'+t.id+'"><span class="ico">'+ic('brief',26)+'</span><span class="grow"><span class="name">'+esc(t.name)+(t.sample?'<span class="badge">مثال</span>':'')+'</span><span class="sub" style="display:block;margin-top:4px">'+fmtRange(t.start,t.end)+'</span></span><span class="money"><b>'+fmtMoney(tripTotal(t))+'</b><span>ريال</span></span><span class="chev">'+ic('chev',20,2.4)+'</span></button>'+balances(t)+'<div class="trip-actions" dir="rtl"><button type="button" class="btn pri" data-act="openTrip" data-id="'+t.id+'">'+ic('brief',20)+'<span>فتح الرحلة</span></button><button type="button" class="btn soft" data-act="editTrip" data-id="'+t.id+'">'+ic('edit',20)+'<span>فتح بطاقة الرحلة</span></button><button type="button" class="btn soft" data-act="downloadCard" data-id="'+t.id+'">'+ic('down',20)+'<span>تحميل <bdi>PDF</bdi></span></button></div></div>').join('')
  :'<div class="card empty"><button class="ico" data-act="newTrip" aria-label="إضافة رحلة">'+ic('plus',26)+'</button><h2>ما عندك رحلات بعد</h2><p>اضغط "إضافة رحلة" وابدأ تسجل مصاريفك وصور فواتيرك.</p></div>';
 return '<div class="hdr tall"><div class="pad"><div class="hrow homehead" style="justify-content:space-between"><button class="btn-white" data-act="newTrip">'+ic('plus',18,2.6)+'<span>إضافة رحلة</span></button><div class="ttl" style="text-align:left"><span class="home-kicker">إدارة المصاريف</span><h1>رحلاتي</h1><span>مصاريف رحلات العمل</span></div></div></div></div>'
 +'<div class="pad float"><div class="stat budgetstat"><div class="lbl">ميزانية الرحلة الحالية'+(active?' — '+esc(active.name):'')+'</div><div class="num">'+(active?budget(active):'—')+'</div>'+(active?balances(active):'<div class="sub">لا توجد رحلة حالية</div>')+'</div></div>'
 +'<div class="pad" style="margin-top:14px"><div class="installhint"><span class="installmark">✦</span><span><b>تطبيقك الخاص</b><small>أضِفه إلى الشاشة الرئيسية من Safari للوصول السريع.</small></span></div></div>'
 +'<div class="pad sec"><div class="sechead"><h2>كل الرحلات</h2><span class="section-count">'+ar(TRIPS.length)+' رحلة</span></div>'+list+'</div>'}

function vNewTrip(){const t=S.tid?cur():null;const d=draft;
 return hdr(t?'تعديل بطاقة الرحلة':'رحلة جديدة',t?'':'سجّل بيانات الرحلة وابدأ بإضافة المصاريف',{tall:true})
 +'<div class="pad float"><form class="form" id="tripForm" novalidate><div class="fld"><label for="tName">اسم الرحلة</label><input class="in" id="tName" data-d="name" value="'+esc(d.name)+'" placeholder="مثال: رحلة الدمام" autocomplete="off" style="border-color:var(--accent)"></div>'
 +'<div class="fld"><label>ميزانية الرحلة (ريال)</label><input class="in" inputmode="decimal" data-d="budget" value="'+esc(d.budget??'')+'" placeholder="المبلغ المحول"></div><div class="fld"><label>إثبات تحويل الميزانية</label><input id="proofFile" type="file" accept="image/*,application/pdf" hidden><label class="proofpick" for="proofFile"><span class="ico">'+ic('up',28)+'</span><strong>'+(d.proof?'استبدال إثبات التحويل':'إرفاق إثبات التحويل')+'</strong><small>صورة أو ملف PDF</small></label>'+(d.proof?'<div class="proofrow"><span class="grow">'+esc(d.proof.name)+'</span><button type="button" class="iconbtn" data-act="viewProof" aria-label="استعراض الإثبات">'+ic('gal',20)+'</button><button type="button" class="iconbtn" data-act="removeProof" aria-label="حذف الإثبات">'+ic('trash',20)+'</button></div>':'')+'</div>'
 +'<div class="row2"><div class="fld"><label for="tStart">تاريخ البداية</label><div class="datewrap"><input class="in" type="date" id="tStart" data-d="start" value="'+esc(d.start)+'">'+ic('cal',17)+'</div></div><div class="fld"><label for="tEnd">تاريخ النهاية</label><div class="datewrap"><input class="in" type="date" id="tEnd" data-d="end" value="'+esc(d.end)+'">'+ic('cal',17)+'</div></div></div>'
 +'<div class="infobox">'+ic('info',22)+'<span>بعد البدء تقدر تضيف المصاريف وصور الفواتير والعمل الإضافي ووقت تشغيل السيارة.</span></div></form></div>'
 +'<div class="pad" style="padding-top:22px"><button class="btn grad" data-act="saveTrip">'+(t?'حفظ التعديل':'بدء الرحلة')+ic('chev',20,2.6)+'</button></div>'}

function vTrip(){const t=cur();if(!t)return '';
 const exps=t.expenses.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const cards=exps.length?exps.map(e=>{const c=CATS[e.cat]||CATS.other;const title=e.desc||e.other||c.l;const tag=e.cat==='other'&&e.other&&e.desc?'أخرى · '+e.other:c.l;

function compress(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

 beg(2);push('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((p,i)=>(3+3*i)+' 0 R').join(' ')+'] >>\nendobj\n');
 for(let i=0;i<n;i++){const pg=3+3*i,ct=4+3*i,im=5+3*i;
  const blob=await new Promise(r=>pages[i].toBlob(r,'image/jpeg',.86));const bytes=new Uint8Array(await blob.arrayBuffer());
  beg(pg);push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';beg(ct);push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  beg(im);push('<< /Type /XObject /Subtype /Image /Width '+pages[i].width+' /Height '+pages[i].height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n')}
 const total=3+3*n;const xr=off;let x='xref\n0 '+total+'\n0000000000 65535 f \n';
 for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'})}
async function exportPDF(t,share=true){
 toast('جاري تجهيز ملف PDF...');
 try{
  const pages=await renderReport(t);let blob=await buildPDF(pages);if(t.proof?.type==='application/pdf'){if(!window.PDFLib)throw Error('PDF merge library unavailable');const out=await PDFLib.PDFDocument.load(await blob.arrayBuffer());const src=await PDFLib.PDFDocument.load(await (await fetch(t.proof.data)).arrayBuffer());const copied=await out.copyPages(src,src.getPageIndices());copied.forEach((pg,i)=>out.insertPage(pages.proofIndex+i,pg));blob=new Blob([await out.save()],{type:'application/pdf'});}
  const safeName=(t.name||'رحلة').replace(/[\\/:*?"<>|]/g,'-');
  const file=new File([blob],safeName+'.pdf',{type:'application/pdf'});
  if(share&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:'تقرير '+(t.name||'الرحلة'),text:'تقرير مصاريف رحلة العمل'});
   S.done='تم فتح قائمة المشاركة';return true;
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=safeName+'.pdf';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  S.done='تم تجهيز ملف PDF. إذا لم يبدأ التنزيل، افتح الملف وشاركه من قائمة المشاركة';toast('تم تجهيز ملف PDF');return true;
 }catch(e){if(e&&e.name==='AbortError'){toast('تم إلغاء المشاركة');return false}console.error(e);toast('تعذر إنشاء التقرير. حاول مرة أخرى');return false}
}
function summary(t){const L=[];L.push(t.name);L.push('من '+fmtRange(t.start,t.end));L.push('الإجمالي: '+fmtMoney(tripTotal(t))+' ريال');L.push('');L.push('المصاريف:');
 t.expenses.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(e=>{const c=CATS[e.cat];L.push('- '+(e.desc||e.other||c.l)+' ('+(e.cat==='other'&&e.other?'أخرى: '+e.other:c.l)+'): '+fmtMoney(e.amount)+' ريال، '+dayName(e.date)+' '+fmtDate(e.date)+(e.photos.length?'، '+ar(e.photos.length)+' صورة':''))});
 const om=otMinutes(t),ce=carEnd(t);L.push('');
 days(t).forEach(d=>L.push('العمل الإضافي '+d.date+': '+fmtTime(d.s)+' — '+fmtTime(d.e)));L.push('الإجمالي: '+fmtDur(allM(t)));L.push('الميزانية: '+budget(t));
 L.push('تاريخ العودة: '+(t.ret?dayName(t.ret)+' '+fmtDate(t.ret):'—'));
 L.push('وقت تشغيل السيارة: '+fmtTime(t.car)+'، نهاية الدوام: '+(ce==null?'—':fmtTime(ce)));return L.join('\n')}

/* ---------- events ---------- */
const root=document.getElementById('view');
function setPath(t,k,v){if(k.startsWith('ots.')){const [,i,f]=k.split('.');days(t)[+i][f]=v}else t[k]=v}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset?.d&&draft){draft[el.dataset.d]=el.value;if(el.dataset.d==='date'){const d=document.getElementById('dayv');if(d)d.textContent=dayName(el.value)||'—'}}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='proofFile'&&el.files[0]){const target=draft,f=el.files[0];try{const data=f.type==='application/pdf'?await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)}):await compress(f,1800,.9);if(draft===target&&S.screen==='newTrip'){draft.proof={name:f.name,type:f.type,data};render()}}catch(err){toast('تعذر قراءة الملف')}return}if(el.dataset?.bind&&S.screen==='trip'){const t=cur();setPath(t,el.dataset.bind,el.value);saveTrip(t);document.querySelectorAll('[data-ot]').forEach(n=>{const m=dayM(days(t)[+n.dataset.ot]);n.textContent=m==null?'—':fmtDur(m)});const total=document.getElementById('otTotal');if(total)total.textContent=fmtDur(allM(t));const hot=document.querySelector('.tile.hot b');if(hot)hot.textContent=carEnd(t)==null?'—':fmtTime(carEnd(t));}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;const t=cur();
 switch(a){
 case 'back':back();break;
 case 'home':stack=[];S={screen:'main'};render();window.scrollTo(0,0);break;
 case 'newTrip':draft={name:'',start:todayISO(),end:todayISO()};go('newTrip',{tid:null});break;
 case 'openTrip':stack=[{screen:'main'}];S={screen:'trip',tid:id};render();window.scrollTo(0,0);break;
 case 'editTrip':{const x=id?TRIPS.find(q=>q.id===id):t;draft={name:x.name,start:x.start,end:x.end,budget:x.budget,proof:x.proof};go('newTrip',{tid:x.id});break;}
 case 'addOT':days(t).push({date:todayISO(),s:'',e:''});await saveTrip(t);render();break;
 case 'removeOT':days(t).splice(+id,1);await saveTrip(t);render();break;
 case 'viewProof':{if(!draft.proof)break;const w=window.open('','_blank');if(!w){toast('اسمح بفتح نافذة الاستعراض');break}try{const blob=await (await fetch(draft.proof.data)).blob();const url=URL.createObjectURL(blob);w.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000)}catch(err){w.close();toast('تعذر استعراض الملف')}break;}
 case 'saveHome':try{await saveTrip(t);stack=[];S={screen:'main'};render();window.scrollTo(0,0);toast('تم حفظ الرحلة')}catch(err){toast('تعذر حفظ الرحلة')}break;
 case 'downloadCard':{const x=TRIPS.find(q=>q.id===id);if(!x||b.disabled)break;b.disabled=true;b.setAttribute('aria-busy','true');try{await saveTrip(x);await exportPDF(x,false)}catch(err){toast('تعذر تحميل التقرير')}finally{b.disabled=false;b.removeAttribute('aria-busy')}break;}
 case 'downloadNow':if(b.disabled)break;b.disabled=true;try{await saveTrip(t);await exportPDF(t,false)}catch(err){toast('تعذر تحميل التقرير')}finally{b.disabled=false}break;
 case 'removeProof':draft.proof=null;render();break;
 case 'saveTrip':{const d=draft;const name=(d.name||'').trim();if(!name){toast('اكتب اسم الرحلة');break}
  if(d.start&&d.end&&d.end<d.start){toast('تاريخ النهاية قبل تاريخ البداية');break}
  if(S.tid){const x=cur();x.name=name;x.start=d.start;x.end=d.end;x.budget=d.budget==null||d.budget===''?null:toNum(d.budget);x.proof=d.proof||null;await saveTrip(x);back()}
  else{const x={id:uid(),name,start:d.start,end:d.end,budget:d.budget==null||d.budget===''?null:toNum(d.budget),proof:d.proof||null,ot:{s:'',e:''},ret:d.end,car:'',expenses:[]};TRIPS.push(x);sortTrips();await saveTrip(x);stack=[{screen:'main'}];S={screen:'trip',tid:x.id};render();window.scrollTo(0,0);toast('تم إنشاء الرحلة')}break}
 case 'delTrip':confirmBox('تحذف رحلة "'+t.name+'" مع كل مصاريفها وصورها؟','حذف الرحلة',async()=>{for(const ex of t.expenses)for(const p of ex.photos)await DB.del('photos',p);await DB.del('trips',t.id);TRIPS=TRIPS.filter(x=>x.id!==t.id);stack=[];S={screen:'main'};render();toast('تم حذف الرحلة')});break;
 case 'newExp':draft={id:null,amount:'',cat:'stay',other:'',date:(todayISO()>=t.start&&todayISO()<=t.end)?todayISO():(t.start||todayISO()),desc:'',receipt:null};go('exp',{tid:t.id});document.getElementById('fCam').click();break;
 case 'editExp':{const x=t.expenses.find(q=>q.id===id);draft={id:x.id,amount:String(x.amount),cat:x.cat,other:x.other||'',date:x.date,desc:x.desc||''};go('exp',{tid:t.id});break}
 case 'cat':draft.cat=id;render();break;
 case 'saveExp':{const amt=toNum(draft.amount);if(!(amt>0)){toast('اكتب المبلغ بالريال');break}
  if(!draft.date){toast('اختر التاريخ');break}
  if(draft.cat==='other'&&!draft.other.trim()&&!draft.desc.trim()){toast('اكتب نوع المصروف أو وصفه');break}
  const rec={amount:amt,cat:draft.cat,other:draft.cat==='other'?draft.other.trim():'',date:draft.date,desc:draft.desc.trim()};
  if(draft.id){Object.assign(t.expenses.find(q=>q.id===draft.id),rec)}else{const photos=[];if(draft.receipt){const pid=uid();await DB.put('photos',{id:pid,data:draft.receipt});photos.push(pid)}t.expenses.push(Object.assign({id:uid(),photos},rec))}
  await saveTrip(t);back();toast('تم حفظ المصروف');break}
 case 'delExp':confirmBox('تحذف هذا المصروف وصوره؟','حذف المصروف',async()=>{const x=t.expenses.find(q=>q.id===draft.id);for(const p of x.photos)await DB.del('photos',p);t.expenses=t.expenses.filter(q=>q.id!==draft.id);await saveTrip(t);back();toast('تم حذف المصروف')});break;
 case 'addPhoto':pending=null;go('photo',{tid:t.id,eid:id});break;
 case 'pickCam':case 'retake':pending=null;document.getElementById('fCam').click();break;
 case 'pickGal':pending=null;document.getElementById('fGal').click();break;
 case 'approve':{const x=t.expenses.find(q=>q.id===S.eid);const pid=uid();await DB.put('photos',{id:pid,data:pending});x.photos.push(pid);await saveTrip(t);pending=null;back();toast('تم حفظ الصورة');break}
 case 'viewPhotos':{const x=t.expenses.find(q=>q.id===id);if(!x.photos.length){toast('ما فيه صور لهذا المصروف بعد');break}
  viewerImgs=[];for(const p of x.photos){const r=await DB.get('photos',p);if(r)viewerImgs.push(r.data)}go('viewer',{tid:t.id,eid:id});break}
 case 'delPhoto':{const sl=document.getElementById('slides');const i=Math.round(Math.abs(sl.scrollLeft)/Math.max(1,sl.clientWidth));
  confirmBox('تحذف هذه الصورة؟','حذف الصورة',async()=>{const x=t.expenses.find(q=>q.id===S.eid);const pid=x.photos[i];await DB.del('photos',pid);x.photos.splice(i,1);await saveTrip(t);viewerImgs.splice(i,1);if(!viewerImgs.length){back()}else{render()}toast('تم حذف الصورة')});break}
 case 'toActions':S.done='';go('actions',{tid:t.id,done:''});break;
 case 'doSave':toast('تم حفظ الرحلة');stack=[];S={screen:'main'};render();window.scrollTo(0,0);break;
 case 'doPdf':{const ok=await exportPDF(t);S.done=ok?'تم تجهيز ملف PDF بنجاح':'';render();break}
 case 'doSend':{modal('<div class="sheet" role="dialog" aria-modal="true"><h2>إرسال الرحلة</h2><textarea id="sumTxt" readonly aria-label="ملخص الرحلة">'+esc(summary(t))+'</textarea><div class="btns"><button class="btn pri" data-act="copySum">'+ic('copy',19)+'<span>نسخ الملخص</span></button><button class="btn soft" data-act="sendPdf">'+ic('down',19)+'<span>حفظ PDF للإرسال</span></button></div><p class="hint">انسخ الملخص والصقه في واتساب أو البريد. أو احفظ ملف PDF وأرسله من قائمة المشاركة في جوالك.</p><button class="btn soft" data-act="mNo">إغلاق</button></div>');break}
 case 'copySum':{const ta=document.getElementById('sumTxt');let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){}
  if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(err){}}toast(ok?'تم نسخ الملخص':'حدّد النص يدوياً وانسخه');break}
 case 'sendPdf':closeModal();{const ok=await exportPDF(t);S.done=ok?'تم تجهيز ملف PDF، أرسله من قائمة المشاركة':'';render()}break;
 case 'mOk':{const f=confirmBox.fn;closeModal();if(f)f();break}
 case 'mNo':closeModal();break}
});
