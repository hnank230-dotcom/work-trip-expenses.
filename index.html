/* Premium financial dashboard */
:root{--bg:#f2f5f7;--card:#fff;--fg:#142839;--muted:#586c7c;--line:#dfe8ec;--tint:#e4f3ef;--tint-fg:#126456;--accent:#087968;--field:#f5f8f9;--fieldline:#d5e1e5;--g1:#087968;--g2:#07594e;--shadow:0 4px 16px #14283908;--shadow-lg:0 12px 28px #14283915;--neutral-chip:#edf2f5;--neutral-fg:#344e60;--chev:#8194a0}
body{letter-spacing:0}.hdr{background:linear-gradient(135deg,#10243f,#173e4a);border-radius:0 0 26px 26px;padding-top:28px;padding-bottom:30px}.hdr.tall{padding-bottom:90px}.hdr::before{background:none;border:1px solid #ffffff19;width:300px;height:300px}.hdr::after{background:none;border:1px solid #ffffff15;width:240px;height:240px}.ttl h1{font-size:25px;letter-spacing:0}.ttl span{font-size:13px;margin-top:5px}.homehead .ttl{order:-1;text-align:right!important;flex:1}.homehead .btn-white{height:44px;padding:0 13px;border-radius:12px;box-shadow:none;font-size:14px}.stat{border:1px solid var(--line);padding:23px 19px;border-radius:19px;box-shadow:var(--shadow-lg)}.stat .num{font-size:36px;color:var(--accent);font-variant-numeric:tabular-nums}.stat .lbl{font-size:14px;margin-bottom:8px}.chip{border-radius:12px;padding:11px 15px;background:var(--tint);color:var(--tint-fg)}.sec{padding-top:24px;gap:12px}.card,.tripcard,.form{border-radius:17px;border:1px solid var(--line)}.tripcard{padding:17px 14px;gap:12px}.ico{background:var(--tint);color:var(--accent);border-radius:13px}.ico.neutral{background:var(--neutral-chip);color:var(--neutral-fg)}.btn,.addbtn,.btn.grad,.bar .btn{border-radius:12px}.btn.pri,.btn.grad,.addbtn,.tile.hot{background:var(--accent);box-shadow:none}.btn.soft,.badge,.result{background:var(--tint);color:var(--tint-fg)}.money b{color:var(--accent)}.in{border-width:1px;border-radius:12px}.in.big{padding-inline-start:16px;padding-inline-end:70px}.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}.form{gap:19px}.seg{border-radius:12px}.seg button{border-radius:9px}.seg button[aria-pressed=true]{box-shadow:none}.bar{width:min(560px,100%);border-radius:20px 20px 0 0;border-top:1px solid var(--line);gap:7px;padding-inline:14px}.bar .btn{padding-inline:7px;gap:5px;font-size:14px}.bar .btn svg{flex-shrink:0}.installhint{background:var(--card);border-color:var(--line);color:var(--fg);border-radius:14px}.installmark{background:var(--tint);color:var(--accent)}.installhint small{color:var(--muted)}.opt.main{background:linear-gradient(135deg,#10243f,#173e4a)}.empty{padding:32px 18px}.empty .ico{width:64px;height:64px}.section-count{font-size:12px;color:var(--muted);font-weight:700}.home-kicker{display:block;font-size:12px!important;letter-spacing:1px;opacity:.75;margin-bottom:7px}.tile{border:1px solid var(--line);border-radius:12px}.tile.hot{border-color:transparent}.iconbtn{border-radius:13px}.sheet{border-radius:22px 22px 0 0}.btn:active,.tripcard:active{transform:scale(.985)}
@media(max-width:360px){.pad{padding-inline:14px}.bar .btn{font-size:12px}.bar .btn svg{width:16px}.homehead .ttl h1{font-size:22px}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101d28;--card:#172936;--fg:#edf5f7;--muted:#acbec9;--line:#304653;--tint:#203e3e;--tint-fg:#a0e7d4;--accent:#4ac6ad;--field:#13232e;--fieldline:#405663;--neutral-chip:#263b49;--neutral-fg:#d3e2e8;--shadow:none;--shadow-lg:none}.btn.pri,.btn.grad,.addbtn,.tile.hot,.seg button[aria-pressed=true]{background:#087968;color:#fff}.installhint small{color:var(--muted)}}
</style>

<div class="app" id="view"></div>
<div id="toast" hidden role="status"></div>
<div id="modal" hidden></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=s=>String(s).replace(/\d/g,d=>AR[d]);
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pISO=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return {y,m,d}};
const fmtDate=iso=>{if(!iso)return '—';const {y,m,d}=pISO(iso);return ar(d)+' '+MONTHS[m-1]+' '+ar(y)};
const dayName=iso=>{if(!iso)return '';const {y,m,d}=pISO(iso);return DAYS[new Date(y,m-1,d).getDay()]};
const fmtRange=(a,b)=>{if(!a||!b)return fmtDate(a||b);const A=pISO(a),B=pISO(b);if(A.y===B.y&&A.m===B.m)return ar(A.d)+' إلى '+ar(B.d)+' '+MONTHS[B.m-1]+' '+ar(B.y);return fmtDate(a)+' إلى '+fmtDate(b)};
const fmtMoney=n=>ar(new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n||0)).replace(/,/g,'٬').replace(/\./g,'٫');
const toNum=s=>{const t=String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/٫/g,'.').replace(/[٬,\s]/g,'');const n=parseFloat(t);return isFinite(n)?n:0};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtTime=t=>{if(t==null||t==='')return '—';const mins=typeof t==='number'?((t%1440)+1440)%1440:toMin(t);const h=Math.floor(mins/60),m=mins%60;const h12=h%12===0?12:h%12;return ar(h12)+':'+ar(String(m).padStart(2,'0'))+' '+(h<12?'ص':'م')};
const fmtDur=min=>{const h=Math.floor(min/60),m=min%60;const parts=[];
  if(h>0)parts.push(h===1?'ساعة':h===2?'ساعتان':(h<=10?ar(h)+' ساعات':ar(h)+' ساعة'));
  if(m===30&&h>0)return parts[0]+' ونص';
  if(m>0)parts.push(ar(m)+' دقيقة');
  return parts.join(' و')||'٠ ساعة'};
const otMinutes=t=>{const a=toMin(t.ot&&t.ot.s),b=toMin(t.ot&&t.ot.e);if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d};
const carEnd=t=>{const a=toMin(t.car);return a==null?null:a+480};
const tripTotal=t=>t.expenses.reduce((s,e)=>s+(+e.amount||0),0);
const CATS={stay:{l:'سكن',i:'bed'},food:{l:'تغذية',i:'food'},other:{l:'أخرى',i:'wrench'}};
const I={
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>',
food:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 4-3 7h3v11"/>',
wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>',
cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
gal:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ret:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',
car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3"/>',
save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
send:'<path d="M21 3l-8 18-3-8-7-3z"/>',chev:'<path d="M15 6l-6 6 6 6"/>',check:'<path d="M5 12l5 5 9-10"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
close:'<path d="M6 6l12 12M18 6L6 18"/>',retry:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
sl:'<path d="M9 6l6 6-6 6"/>'
};
const ic=(n,s=20,w=2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const DB={db:null,mem:{trips:{},photos:{}},
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('masarif-rihlat',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('trips',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  run(store,mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  async all(s){if(!this.db)return Object.values(this.mem[s]);try{return await this.run(s,'readonly',o=>o.getAll())||[]}catch(e){return Object.values(this.mem[s])}},
  async get(s,id){if(!this.db)return this.mem[s][id];try{return await this.run(s,'readonly',o=>o.get(id))}catch(e){return this.mem[s][id]}},
  async put(s,v){this.mem[s][v.id]=v;if(this.db){try{await this.run(s,'readwrite',o=>o.put(v))}catch(e){}}},
  async del(s,id){delete this.mem[s][id];if(this.db){try{await this.run(s,'readwrite',o=>o.delete(id))}catch(e){}}}
};

/* ---------- state ---------- */
let TRIPS=[];let S={screen:'main'};let stack=[];let draft=null;let pending=null;let viewerImgs=[];

const sortTrips=()=>TRIPS.sort((a,b)=>String(b.start).localeCompare(String(a.start)));
const cur=()=>TRIPS.find(t=>t.id===S.tid);
const saveTrip=t=>DB.put('trips',t);
/* ---------- UI utilities ---------- */
let tt=null;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},2600)}
function modal(html){const m=document.getElementById('modal');m.innerHTML=html;m.hidden=false}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML=''}
function confirmBox(msg,label,fn){modal('<div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(msg)+'</h2><div class="btns"><button class="btn danger" data-act="mOk">'+esc(label)+'</button><button class="btn soft" data-act="mNo">إلغاء</button></div></div>');confirmBox.fn=fn}
function go(screen,params,push){if(push!==false)stack.push(S);S=Object.assign({screen:screen},params||{});render();window.scrollTo(0,0)}
function back(){S=stack.pop()||{screen:'main'};render();}

/* ---------- views ---------- */
function hdr(title,sub,opts){opts=opts||{};
 return '<div class="hdr'+(opts.tall?' tall':'')+'"><div class="pad"><div class="hrow"><button class="iconbtn" data-act="back" aria-label="رجوع">'+ic('back',22,2.4)+'</button><div class="grow ttl"><h1>'+esc(title)+'</h1>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>'+(opts.right||'')+'</div>'+(opts.extra||'')+'</div></div>'}

function vMain(){
 const total=TRIPS.reduce((s,t)=>s+tripTotal(t),0);
 const list=TRIPS.length?TRIPS.map(t=>'<button class="tripcard" data-act="openTrip" data-id="'+t.id+'"><span class="ico">'+ic('brief',26)+'</span><span class="grow"><span class="name">'+esc(t.name)+(t.sample?'<span class="badge">مثال</span>':'')+'</span><span class="sub" style="display:block;margin-top:4px">'+fmtRange(t.start,t.end)+'</span></span><span class="money"><b>'+fmtMoney(tripTotal(t))+'</b><span>ريال</span></span><span class="chev">'+ic('chev',20,2.4)+'</span></button>').join('')
  :'<div class="card empty"><span class="ico">'+ic('brief',26)+'</span><h2>ما عندك رحلات بعد</h2><p>اضغط "إضافة رحلة" وابدأ تسجل مصاريفك وصور فواتيرك.</p></div>';
 return '<div class="hdr tall"><div class="pad"><div class="hrow homehead" style="justify-content:space-between"><button class="btn-white" data-act="newTrip">'+ic('plus',18,2.6)+'<span>إضافة رحلة</span></button><div class="ttl" style="text-align:left"><span class="home-kicker">إدارة المصاريف</span><h1>رحلاتي</h1><span>مصاريف رحلات العمل</span></div></div></div></div>'
 +'<div class="pad float"><div class="stat"><div><div class="lbl">إجمالي كل الرحلات</div><div><span class="num">'+fmtMoney(total)+'</span> <span class="cur">ريال</span></div></div><div class="chip"><b>'+ar(TRIPS.length)+'</b><span>رحلات</span></div></div></div>'
 +'<div class="pad" style="margin-top:14px"><div class="installhint"><span class="installmark">✦</span><span><b>تطبيقك الخاص</b><small>أضِفه إلى الشاشة الرئيسية من Safari للوصول السريع.</small></span></div></div>'
 +'<div class="pad sec"><div class="sechead"><h2>كل الرحلات</h2><span class="section-count">'+ar(TRIPS.length)+' رحلة</span></div>'+list+'</div>'}

function vNewTrip(){const t=S.tid?cur():null;const d=draft;
 return hdr(t?'تعديل الرحلة':'رحلة جديدة',t?'':'سجّل بيانات الرحلة وابدأ بإضافة المصاريف',{tall:true})
 +'<div class="pad float"><form class="form" id="tripForm" novalidate><div class="fld"><label for="tName">اسم الرحلة</label><input class="in" id="tName" data-d="name" value="'+esc(d.name)+'" placeholder="مثال: رحلة الدمام" autocomplete="off" style="border-color:var(--accent)"></div>'
 +'<div class="row2"><div class="fld"><label for="tStart">تاريخ البداية</label><div class="datewrap"><input class="in" type="date" id="tStart" data-d="start" value="'+esc(d.start)+'">'+ic('cal',17)+'</div></div><div class="fld"><label for="tEnd">تاريخ النهاية</label><div class="datewrap"><input class="in" type="date" id="tEnd" data-d="end" value="'+esc(d.end)+'">'+ic('cal',17)+'</div></div></div>'
 +'<div class="infobox">'+ic('info',22)+'<span>بعد البدء تقدر تضيف المصاريف وصور الفواتير والعمل الإضافي ووقت تشغيل السيارة.</span></div></form></div>'
 +'<div class="pad" style="padding-top:22px"><button class="btn grad" data-act="saveTrip">'+(t?'حفظ التعديل':'بدء الرحلة')+ic('chev',20,2.6)+'</button></div>'}

function vTrip(){const t=cur();if(!t)return '';
 const exps=t.expenses.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const cards=exps.length?exps.map(e=>{const c=CATS[e.cat]||CATS.other;const title=e.desc||e.other||c.l;const tag=e.cat==='other'&&e.other&&e.desc?'أخرى · '+e.other:c.l;
  const n=e.photos.length;
  return '<div class="card"><button class="exp-top" data-act="editExp" data-id="'+e.id+'" aria-label="تعديل المصروف"><span class="ico sm'+(e.cat==='other'?' neutral':'')+'">'+ic(c.i,24)+'</span><span class="grow"><span class="name" style="font-size:17px;display:block">'+esc(title)+'</span><span class="tag'+(e.cat==='other'?' n':'')+'">'+esc(tag)+'</span></span><span class="money"><b style="font-size:24px">'+fmtMoney(e.amount)+'</b><span>ريال</span></span></button><div class="sep"></div>'
  +'<div class="btns"><button class="btn pri" data-act="addPhoto" data-id="'+e.id+'">'+ic('cam',19)+'<span>إضافة صورة</span></button><button class="btn soft'+(n?'':' off')+'" data-act="viewPhotos" data-id="'+e.id+'">'+ic('gal',19)+'<span>استعراض الصور ('+ar(n)+')</span></button></div></div>'}).join('')
  :'<div class="card empty"><button type="button" class="ico" data-act="newExp" aria-label="إضافة مصروف">'+ic('plus',26)+'</button><p>ما فيه مصاريف بعد. اضغط "إضافة مصروف" وسجّل أول مصروف.</p></div>';
 const om=otMinutes(t),ce=carEnd(t);
 return '<div class="hdr"><div class="pad"><div class="hrow"><button class="iconbtn" data-act="back" aria-label="رجوع">'+ic('back',22,2.4)+'</button><div class="grow ttl"><h1>'+esc(t.name)+(t.sample?'<span class="badge">مثال</span>':'')+'</h1></div><button class="iconbtn" data-act="editTrip" aria-label="تعديل الرحلة">'+ic('edit',20)+'</button><button class="iconbtn" data-act="delTrip" aria-label="حذف الرحلة">'+ic('trash',20)+'</button></div>'
 +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><div class="pill" style="gap:8px;font-size:14px">'+ic('cal',17)+'<span>من '+fmtRange(t.start,t.end)+'</span></div><div class="pill" style="background:#fff;color:#1646C0;gap:8px;font-size:14px">الإجمالي <span style="font-size:16px">'+fmtMoney(tripTotal(t))+' ريال</span></div></div></div></div>'
 +'<div class="pad" style="padding-bottom:130px"><div class="sec"><div class="sechead"><h2 style="font-size:19px">الفواتير والمصاريف</h2><button class="addbtn" data-act="newExp">'+ic('plus',18,2.6)+'<span>إضافة مصروف</span></button></div>'+cards
 +'<div class="card"><div class="ch"><span class="ico">'+ic('clock',22,2.2)+'</span><h2>العمل الإضافي</h2></div><div class="tiles"><label class="tile"><span>وقت البداية</span><input type="time" data-bind="ot.s" value="'+esc(t.ot.s)+'"></label><label class="tile"><span>وقت النهاية</span><input type="time" data-bind="ot.e" value="'+esc(t.ot.e)+'"></label></div><div class="result"><span>ساعات الأوفر تايم <span class="badge" style="background:var(--card)">تلقائي</span></span><b>'+(om==null?'—':fmtDur(om))+'</b></div></div>'
 +'<div class="card"><div class="ch"><span class="ico">'+ic('ret',22,2.2)+'</span><h2>العودة</h2></div><label class="tile"><span>تاريخ العودة'+(t.ret?' · '+dayName(t.ret):'')+'</span><input type="date" data-bind="ret" value="'+esc(t.ret)+'"></label>'+(t.ret?'<div class="note" style="margin-top:8px">'+fmtDate(t.ret)+'</div>':'')+'</div>'
 +'<div class="card"><div class="ch"><span class="ico">'+ic('car',22,2.2)+'</span><h2>وقت تشغيل السيارة</h2></div><div class="tiles"><label class="tile"><span>وقت التشغيل</span><input type="time" data-bind="car" value="'+esc(t.car)+'"></label><div class="tile hot"><span>وقت نهاية الدوام</span><b>'+(ce==null?'—':fmtTime(ce))+'</b></div></div><div class="note">يُحسب تلقائياً بعد ٨ ساعات بالضبط من وقت التشغيل.</div></div>'
 +'</div></div>'
 +'<div class="bar"><button class="btn grad" style="flex:1.2;min-height:56px;font-size:16px;border-radius:16px" data-act="toActions">'+ic('save',20,2.2)+'<span>حفظ</span></button><button class="btn soft" style="flex:1.3" data-act="toActions">'+ic('down',20,2.2)+'<span>تحميل PDF</span></button><button class="btn soft" data-act="toActions">'+ic('send',20,2.2)+'<span>إرسال</span></button></div>'}

function vExp(){const d=draft;const sel=k=>'aria-pressed="'+(d.cat===k)+'"';

function compress(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
async function onFile(ev){const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;try{const target=S.screen==='exp'?draft:null;const data=await compress(f,1400,.82);if(target){if(S.screen!=='exp'||draft!==target)return;target.receipt=data}else if(S.screen==='photo'){pending=data}else{return}render()}catch(e){toast('ما قدرت أقرأ الصورة، جرّب صورة ثانية')}}

async function buildPDF(pages){
 const enc=new TextEncoder();const chunks=[];let off=0;const offs={};
 const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);off+=b.length};
 const beg=n=>{offs[n]=off;push(n+' 0 obj\n')};
 push('%PDF-1.4\n');
 const n=pages.length;beg(1);push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 beg(2);push('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((p,i)=>(3+3*i)+' 0 R').join(' ')+'] >>\nendobj\n');
 for(let i=0;i<n;i++){const pg=3+3*i,ct=4+3*i,im=5+3*i;
  const blob=await new Promise(r=>pages[i].toBlob(r,'image/jpeg',.86));const bytes=new Uint8Array(await blob.arrayBuffer());
  beg(pg);push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';beg(ct);push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  beg(im);push('<< /Type /XObject /Subtype /Image /Width '+pages[i].width+' /Height '+pages[i].height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n')}
 const total=3+3*n;const xr=off;let x='xref\n0 '+total+'\n0000000000 65535 f \n';
 for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'})}

  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){

  }

  setTimeout(()=>URL.revokeObjectURL(url),60000);

  if(d.start&&d.end&&d.end<d.start){toast('تاريخ النهاية قبل تاريخ البداية');break}
  if(S.tid){const x=cur();x.name=name;x.start=d.start;x.end=d.end;await saveTrip(x);back()}
  else{const x={id:uid(),name,start:d.start,end:d.end,ot:{s:'',e:''},ret:d.end,car:'',expenses:[]};TRIPS.push(x);sortTrips();await saveTrip(x);stack=[{screen:'main'}];S={screen:'trip',tid:x.id};render();window.scrollTo(0,0);toast('تم إنشاء الرحلة')}break}
 case 'delTrip':confirmBox('تحذف رحلة "'+t.name+'" مع كل مصاريفها وصورها؟','حذف الرحلة',async()=>{for(const ex of t.expenses)for(const p of ex.photos)await DB.del('photos',p);await DB.del('trips',t.id);TRIPS=TRIPS.filter(x=>x.id!==t.id);stack=[];S={screen:'main'};render();toast('تم حذف الرحلة')});break;
 case 'newExp':draft={id:null,amount:'',cat:'stay',other:'',date:(todayISO()>=t.start&&todayISO()<=t.end)?todayISO():(t.start||todayISO()),desc:'',receipt:null};go('exp',{tid:t.id});document.getElementById('fCam').click();break;
 case 'editExp':{const x=t.expenses.find(q=>q.id===id);draft={id:x.id,amount:String(x.amount),cat:x.cat,other:x.other||'',date:x.date,desc:x.desc||''};go('exp',{tid:t.id});break}
 case 'cat':draft.cat=id;render();break;
 case 'saveExp':{const amt=toNum(draft.amount);if(!(amt>0)){toast('اكتب المبلغ بالريال');break}
  if(!draft.date){toast('اختر التاريخ');break}
  if(draft.cat==='other'&&!draft.other.trim()&&!draft.desc.trim()){toast('اكتب نوع المصروف أو وصفه');break}
  const rec={amount:amt,cat:draft.cat,other:draft.cat==='other'?draft.other.trim():'',date:draft.date,desc:draft.desc.trim()};
  if(draft.id){Object.assign(t.expenses.find(q=>q.id===draft.id),rec)}else{const photos=[];if(draft.receipt){const pid=uid();await DB.put('photos',{id:pid,data:draft.receipt});photos.push(pid)}t.expenses.push(Object.assign({id:uid(),photos},rec))}
  await saveTrip(t);back();toast('تم حفظ المصروف');break}
 case 'delExp':confirmBox('تحذف هذا المصروف وصوره؟','حذف المصروف',async()=>{const x=t.expenses.find(q=>q.id===draft.id);for(const p of x.photos)await DB.del('photos',p);t.expenses=t.expenses.filter(q=>q.id!==draft.id);await saveTrip(t);back();toast('تم حذف المصروف')});break;
 case 'addPhoto':pending=null;go('photo',{tid:t.id,eid:id});break;
 case 'pickCam':case 'retake':pending=null;document.getElementById('fCam').click();break;
 case 'pickGal':pending=null;document.getElementById('fGal').click();break;
 case 'approve':{const x=t.expenses.find(q=>q.id===S.eid);const pid=uid();await DB.put('photos',{id:pid,data:pending});x.photos.push(pid);await saveTrip(t);pending=null;back();toast('تم حفظ الصورة');break}
 case 'viewPhotos':{const x=t.expenses.find(q=>q.id===id);if(!x.photos.length){toast('ما فيه صور لهذا المصروف بعد');break}
  viewerImgs=[];for(const p of x.photos){const r=await DB.get('photos',p);if(r)viewerImgs.push(r.data)}go('viewer',{tid:t.id,eid:id});break}
 case 'delPhoto':{const sl=document.getElementById('slides');const i=Math.round(Math.abs(sl.scrollLeft)/Math.max(1,sl.clientWidth));
  confirmBox('تحذف هذه الصورة؟','حذف الصورة',async()=>{const x=t.expenses.find(q=>q.id===S.eid);const pid=x.photos[i];await DB.del('photos',pid);x.photos.splice(i,1);await saveTrip(t);viewerImgs.splice(i,1);if(!viewerImgs.length){back()}else{render()}toast('تم حذف الصورة')});break}
 case 'toActions':S.done='';go('actions',{tid:t.id,done:''});break;
 case 'doSave':toast('تم حفظ الرحلة');stack=[];S={screen:'main'};render();window.scrollTo(0,0);break;
 case 'doPdf':{const ok=await exportPDF(t);S.done=ok?'تم تجهيز ملف PDF بنجاح':'';render();break}
 case 'doSend':{modal('<div class="sheet" role="dialog" aria-modal="true"><h2>إرسال الرحلة</h2><textarea id="sumTxt" readonly aria-label="ملخص الرحلة">'+esc(summary(t))+'</textarea><div class="btns"><button class="btn pri" data-act="copySum">'+ic('copy',19)+'<span>نسخ الملخص</span></button><button class="btn soft" data-act="sendPdf">'+ic('down',19)+'<span>حفظ PDF للإرسال</span></button></div><p class="hint">انسخ الملخص والصقه في واتساب أو البريد. أو احفظ ملف PDF وأرسله من قائمة المشاركة في جوالك.</p><button class="btn soft" data-act="mNo">إغلاق</button></div>');break}
 case 'copySum':{const ta=document.getElementById('sumTxt');let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){}
  if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(err){}}toast(ok?'تم نسخ الملخص':'حدّد النص يدوياً وانسخه');break}
 case 'sendPdf':closeModal();{const ok=await exportPDF(t);S.done=ok?'تم تجهيز ملف PDF، أرسله من قائمة المشاركة':'';render()}break;
 case 'mOk':{const f=confirmBox.fn;closeModal();if(f)f();break}
 case 'mNo':closeModal();break}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- boot ---------- */
(async function(){
 await DB.open();TRIPS=await DB.all('trips');
 TRIPS=TRIPS.filter(t=>{if(t.sample){DB.del('trips',t.id);return false}return true});
 sortTrips();render();
})();
})();
</script>
